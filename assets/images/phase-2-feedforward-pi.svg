<svg xmlns="http://www.w3.org/2000/svg" width="680" height="670" viewBox="0 0 680 670" role="img" aria-labelledby="title description">
  <title id="title">Feedforward and PI share one final command limit</title>
  <desc id="description">Speed demand branches to an inverse model producing feedforward PWM and to an error calculation using measured speed. PI converts error to PWM contributions. The active contributions are summed and limited before driving the motor. Encoders return measured speed to the error calculation. Anti-windup checks the total candidate command; zero demand and the trial deadline override drive.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#277052"/>
    </marker>
  </defs>
  <rect width="680" height="670" rx="8" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#243b30">
    <text x="340" y="30" font-size="20">Demand r: counts/s</text>
    <g fill="none" stroke="#277052" stroke-width="2" marker-end="url(#arrow)">
      <path d="M340 42 V65 H160 V92"/>
      <path d="M340 65 H498 V92"/>
      <path d="M498 163 V195"/>
      <path d="M160 198 V360 H202"/>
      <path d="M498 279 V300 H340 V317"/>
      <path d="M340 408 V440"/>
      <path d="M340 498 V526"/>
      <path d="M340 602 V622 H650 V130 H618"/>
    </g>
    <g stroke="#80a995" stroke-width="1.5">
      <rect x="35" y="95" width="250" height="103" rx="8" fill="#e1f3e9"/>
      <rect x="380" y="95" width="235" height="68" rx="8" fill="#f0f5f1"/>
      <rect x="380" y="198" width="235" height="81" rx="8" fill="#e1f3e9"/>
      <rect x="205" y="320" width="270" height="88" rx="8" fill="#fff3ce"/>
      <rect x="205" y="443" width="270" height="55" rx="8" fill="#f0f5f1"/>
      <rect x="205" y="529" width="270" height="73" rx="8" fill="#f0f5f1"/>
    </g>
    <g font-size="19">
      <text x="160" y="127">Saved inverse model</text>
      <text x="160" y="156">Demand → FF PWM</text>
      <text x="160" y="181" font-size="16">No extra deadband offset</text>
      <text x="498" y="124">Error e = r − v</text>
      <text x="498" y="149" font-size="16">Subtract measured speed</text>
      <text x="498" y="228">PI: P PWM + I PWM</text>
      <text x="498" y="253" font-size="15">Anti-windup checks</text>
      <text x="498" y="271" font-size="15">total FF + P + proposed I</text>
      <text x="340" y="350">Sum active contributions</text>
      <text x="340" y="376">Then limit to 0 … U</text>
      <text x="340" y="398" font-size="15">One final PWM command</text>
      <text x="340" y="477">Left motor and wheel</text>
      <text x="340" y="556">Encoder speed estimate v</text>
      <text x="340" y="584" font-size="16">Count change / elapsed seconds</text>
    </g>
    <text x="340" y="651" font-size="16">Zero demand and the trial deadline override drive.</text>
  </g>
</svg>
