<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="title desc">
  <title id="title">Deadband compensation preserves zero and the upper command limit</title>
  <desc id="desc">For positive normalised requests, the compensated PWM begins above b and rises to U. The uncompensated PWM rises from zero to U. Exactly zero always requests zero PWM. This is a command mapping, not a graph of measured motor speed.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334155" stroke-width="1.2"/></marker>
  </defs>
  <rect width="680" height="400" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#243746">
    <text x="36" y="32" font-size="17" font-weight="700">Choose a command before the motor responds</text>
    <rect x="92" y="215" width="478" height="99" fill="#fff0d9"/>
    <text x="325" y="279" font-size="14" fill="#79551c">Low-command region skipped</text>
    <text x="325" y="299" font-size="14" fill="#79551c">for positive requests</text>
    <path d="M92 314 H599" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M92 314 V63" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M92 95 H570 V314 M92 215 H570" fill="none" stroke="#a0aebb" stroke-dasharray="5 5"/>
    <path d="M92 314 L570 95" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="9 5"/>
    <path d="M92 215 L570 95" fill="none" stroke="#087f8c" stroke-width="4"/>
    <circle cx="92" cy="215" r="6" fill="#f8fafc" stroke="#087f8c" stroke-width="3"/>
    <circle cx="92" cy="314" r="6" fill="#243746"/>
    <circle cx="570" cy="95" r="5" fill="#087f8c"/>
    <text x="66" y="100" font-size="17">U</text>
    <text x="67" y="220" font-size="17">b</text>
    <text x="72" y="338" font-size="15">0</text>
    <text x="566" y="338" font-size="15">1</text>
    <text x="332" y="358" font-size="15" text-anchor="middle">Normalised forward request q (not speed)</text>
    <text transform="translate(35 208) rotate(-90)" font-size="15" text-anchor="middle">Requested PWM u</text>
    <text x="183" y="126" font-size="15" fill="#087f8c" font-weight="700">Compensated: b + (U − b)q</text>
    <text x="263" y="251" font-size="15" fill="#475569">Uncompensated: Uq</text>
    <text x="340" y="384" font-size="14" text-anchor="middle">Exactly q = 0 → u = 0 in both cases</text>
  </g>
</svg>
